<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>404 - Seite nicht gefunden</title>
<link rel="icon" href="icon3 (1).png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#0c0e12;
    --panel:#14171d;
    --line:#242830;
    --ink:#e9eaee;
    --ink-dim:#8a8f9a;
    --accent:#6fc3f5;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:2.5em 2em;
    max-width:400px;
    width:100%;
    text-align:center;
  }
  .emoji{ font-size:2.4em; margin-bottom:.4em; }
  h1{
    font-size:2.6em;
    margin:0 0 .2em;
    letter-spacing:1px;
    color:var(--accent);
  }
  .desc{ color:var(--ink-dim); font-size:1.05em; line-height:1.6; margin-bottom:1.3em; }
  .desc a{ color:var(--accent); text-decoration:underline; }
  .btn{
    background:var(--accent); color:#0c0e12; font-weight:600;
    border:none; border-radius:8px; padding:.7em 1.4em;
    font-size:1em; text-decoration:none; display:inline-block;
    transition:opacity .15s ease;
  }
  .btn:hover{ opacity:.85; }
  footer{
    border-top:1px solid var(--line);
    padding:20px;
    text-align:center;
    font-size:.8rem;
    color:var(--ink-dim);
  }
  footer a{ color:var(--ink-dim); text-decoration:none; }
  footer a:hover{ color:var(--ink); }
</style>
</head>
<body>

<main>
  <div class="card">
    <div class="emoji">🚫</div>
    <h1>404</h1>
    <div class="desc">
      Diese Seite gibt es nicht.<br>
      Vielleicht ist der Link falsch oder die Seite wurde verschoben.<br><br>
    </div>
    <a href="https://lukas-geiger.com/" class="btn">Zur Startseite</a>
  </div>
</main>

<footer>
  <a href="datenschutz">Datenschutz</a>
</footer>

</body>
</html>
