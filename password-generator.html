<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Passwort Generator — Lukas Geiger</title>
<link rel="icon" href="icon3 (1).png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#0c0e12; --panel:#14171d; --line:#242830;
    --ink:#e9eaee; --ink-dim:#8a8f9a; --accent:#6fc3f5;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin:0; min-height:100vh; display:flex; flex-direction:column;
  }
  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
  .container{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:2em; max-width:400px; width:100%;
  }
  h1{ font-size:1.5em; margin-bottom:.4em; }
  .desc{ font-size:.95em; margin-bottom:1.3em; color:var(--ink-dim); line-height:1.6; }
  .output{
    background:var(--bg); border:1px solid var(--line); color:var(--accent);
    font-size:1.2em; padding:.7em 1em; border-radius:8px; margin-bottom:1em;
    text-align:center; font-weight:bold; letter-spacing:1px; word-break:break-all;
    cursor:pointer; user-select:all; transition:background .2s, color .2s, border-color .2s;
  }
  .output.copied{ background:var(--accent); color:#0c0e12; border-color:var(--accent); }
  .options{ margin-bottom:1em; }
  label{ display:block; margin-bottom:.5em; font-size:1em; cursor:pointer; color:var(--ink); }
  input[type="number"]{
    width:60px; padding:.3em; border-radius:5px; border:1px solid var(--line);
    margin-left:.5em; font-size:1em; background:var(--bg); color:var(--ink);
  }
  .generate-btn{
    background:var(--accent); color:#0c0e12; border:none; border-radius:8px;
    padding:.7em 1.4em; font-size:1.05em; font-weight:700; cursor:pointer;
    margin-top:1em; width:100%; transition:opacity .15s;
  }
  .generate-btn:hover{ opacity:.85; }
  .checkbox-group{ display:flex; flex-direction:column; gap:.4em; margin-bottom:1em; }
  input[type="checkbox"]{ accent-color:var(--accent); }
  footer{ border-top:1px solid var(--line); padding:20px; text-align:center; font-size:.8rem; color:var(--ink-dim); }
  footer a{ color:var(--ink-dim); text-decoration:none; }
  footer a:hover{ color:var(--ink); }
</style>
</head>
<body>

<main>
  <div class="container">
    <h1>Passwort Generator</h1>
    <div class="desc">
      Erstellt sichere Passwörter für deine Accounts.<br>
      Läuft lokal im Browser, die Passwörter verlassen das Gerät nicht.
    </div>
    <div class="output" id="password-output" title="Klicken zum Kopieren">DeinPasswortHier1$</div>
    <div class="options">
      <div class="checkbox-group">
        <label><input type="checkbox" id="letters" checked> Buchstaben (a-z, A-Z)</label>
        <label><input type="checkbox" id="numbers" checked> Zahlen (0-9)</label>
        <label><input type="checkbox" id="specials"> Sonderzeichen (!@#$%^&*_[]=)</label>
      </div>
      <label>
        <span>Passwortlänge</span>
        <input type="number" id="length" min="4" max="64" value="20">
      </label>
    </div>
    <button class="generate-btn" onclick="generatePassword()">Passwort generieren</button>
  </div>
</main>

<footer>
  <a href="datenschutz.html">Datenschutz</a>
</footer>

<script>
function generatePassword() {
  const useLetters = document.getElementById('letters').checked;
  const useNumbers = document.getElementById('numbers').checked;
  const useSpecials = document.getElementById('specials').checked;
  const length = parseInt(document.getElementById('length').value, 10);

  let chars = '';
  if (useLetters) chars += 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (useNumbers) chars += '0123456789';
  if (useSpecials) chars += '!@#$%^&*_[]=';

  if (!chars) {
    document.getElementById('password-output').textContent = 'Bitte mindestens eine Option wählen!';
    return;
  }

  let password = '';
  for (let i = 0; i < length; i++) {
    password += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  document.getElementById('password-output').textContent = password;
  document.getElementById('password-output').classList.remove('copied');
}

document.getElementById('password-output').addEventListener('click', function () {
  const pw = this.textContent;
  if (pw && pw !== 'Bitte mindestens eine Option wählen!') {
    navigator.clipboard.writeText(pw);
    this.classList.add('copied');
    this.textContent = 'Kopiert!';
    setTimeout(() => generatePassword(), 900);
  }
});

window.onload = generatePassword;
</script>

</body>
</html>
